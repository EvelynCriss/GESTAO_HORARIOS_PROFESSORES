{% extends 'base.html' %}

{% block title %}Editar Professor{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Editar Professor</h1>
    <a href="{{ url_for('listar_professores') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section">
    <form method="POST" action="{{ url_for('edit_professor', id=professor.id) }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="nome">Nome do Professor</label>
                <input type="text" class="form-control" id="nome" name="nome" value="{{ professor.nome }}" required
                    placeholder="Digite o nome do professor">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ professor.email or '' }}"
                    placeholder="contato@empresa.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="telefone">Telefone</label>
                <input type="text" class="form-control" id="telefone" name="telefone"
                    value="{{ professor.telefone or '' }}" maxlength="16" placeholder="(00) 0 0000-0000"
                    oninput="aplicarMascaraTelefone(this)">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Dias disponíveis</label>
            <div class="form-row">
                {% for dia in ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'] %}
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="dia_{{ loop.index }}" name="dias_semana"
                        value="{{ dia }}" {% if dia in dias_selecionados %}checked{% endif %}>
                    <label class="form-check-label" for="dia_{{ loop.index }}">{{ dia }}</label>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Atualizar Professor</button>
            <a href="{{ url_for('listar_professores') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script>
    function aplicarMascaraTelefone(input) {
        let valor = input.value.replace(/\D/g, '');

        valor = valor.substring(0, 11);

        let formatado = "";

        if (valor.length > 0) {
            formatado += "(" + valor.substring(0, 2);
        }
        if (valor.length > 2) {
            formatado += ") " + valor.substring(2, 3);
        }
        if (valor.length > 3) {
            formatado += " " + valor.substring(3, 7);
        }
        if (valor.length > 7) {
            formatado += "-" + valor.substring(7, 11);
        }

        input.value = formatado;
    }

    document.addEventListener("DOMContentLoaded", function () {
        let telefoneInput = document.getElementById("telefone");
        if (telefoneInput.value) {
            aplicarMascaraTelefone(telefoneInput);
        }
    });
</script>
{% endblock %}
