{% extends 'base.html' %}

{% block title %}Adicionar Professor{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Novo Professor</h1>
    <a href="{{ url_for('listar_professores') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section">
    <form method="POST" action="{{ url_for('add_professor') }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="nome">Nome do Professor</label>
                <input type="text" 
                       class="form-control" 
                       id="nome" 
                       name="nome" 
                       required
                       placeholder="Digite o nome do professor">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" 
                       class="form-control" 
                       id="email" 
                       name="email"
                       placeholder="contato@empresa.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="telefone">Telefone</label>
                <input type="text" 
                       class="form-control" 
                       id="telefone" 
                       name="telefone"
                       maxlength="15"
                       placeholder="(00) 00000-0000">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Dias disponíveis</label>
            <div class="form-row">
                {% for dia in ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'] %}
                <div class="form-check">
                    <input type="checkbox"
                           class="form-check-input"
                           id="dia_{{ loop.index }}"
                           name="dias_semana"
                           value="{{ dia }}">
                    <label class="form-check-label" for="dia_{{ loop.index }}">{{ dia }}</label>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Professor</button>
            <a href="{{ url_for('listar_professores') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
