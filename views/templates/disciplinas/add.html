{% extends 'base.html' %}

{% block title %}Adicionar Disciplina{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Nova Disciplina</h1>
    <a href="{{ url_for('listar_disciplinas') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section">
    <form method="POST" action="{{ url_for('add_disciplina') }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="nome">Nome da Disciplina</label>
                <input type="text" class="form-control" id="nome" name="nome" required
                    placeholder="Ex: Engenharia de Software">
            </div>

            <div class="form-group">
                <label class="form-label" for="cor">Cor de Identificação</label>
                <input type="color" class="form-control" id="cor" name="cor" required
                    style="height: 45px; cursor: pointer;">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="curso_id">Curso Vinculado</label>
                <select class="form-control" id="curso_id" name="curso_id" required>
                    <option value="" disabled selected>Selecione um curso...</option>
                    {% for curso in cursos %}
                    <option value="{{ curso.id }}">{{ curso.nome }} ({{ curso.periodo }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Disciplina</button>
            <a href="{{ url_for('listar_disciplinas') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
