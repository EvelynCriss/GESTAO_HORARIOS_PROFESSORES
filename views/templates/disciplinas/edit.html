{% extends 'base.html' %}

{% block title %}Editar Disciplina{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Editar Disciplina</h1>
    <a href="{{ url_for('listar_disciplinas') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section">
    <form method="POST" action="{{ url_for('edit_disciplina', id=disciplina.id) }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="nome">Nome da Disciplina</label>
                <input type="text" class="form-control" id="nome" name="nome" value="{{ disciplina.nome }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="cor">Cor de Identificação</label>
                <input type="color" class="form-control" id="cor" name="cor" value="{{ disciplina.cor }}" required
                    style="height: 45px; cursor: pointer;">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="curso_id">Curso Vinculado</label>
                <select class="form-control" id="curso_id" name="curso_id" required>
                    {% for curso in cursos %}
                    <option value="{{ curso.id }}" {% if curso.id==disciplina.curso_id %}selected{% endif %}>
                        {{ curso.nome }} ({{ curso.periodo }})
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Atualizar Disciplina</button>
            <a href="{{ url_for('listar_disciplinas') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
