{% extends 'base.html' %}

{% block title %}Editar Curso{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Editar Curso</h1>
    <a href="{{ url_for('listar_cursos') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="form-wrapper">
    <form method="POST" action="{{ url_for('edit_curso', id=curso.id) }}">
        
        <div class="form-group">
            <label class="form-label" for="nome">Nome do Curso</label>
            <input type="text" 
                   class="form-control" 
                   id="nome" 
                   name="nome" 
                   value="{{ curso.nome }}"
                   required
                   placeholder="Ex: Engenharia de Software">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="periodo">Período</label>
                <select class="form-control" id="periodo" name="periodo" required>
                    <option value="Matutino" {% if curso.periodo == 'Matutino' %}selected{% endif %}>Matutino</option>
                    <option value="Vespertino" {% if curso.periodo == 'Vespertino' %}selected{% endif %}>Vespertino</option>
                    <option value="Noturno" {% if curso.periodo == 'Noturno' %}selected{% endif %}>Noturno</option>
                    <option value="Integral" {% if curso.periodo == 'Integral' %}selected{% endif %}>Integral</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="campus">Campus</label>
                <input type="text" 
                       class="form-control" 
                       id="campus" 
                       name="campus"
                       value="{{ curso.campus }}"
                       required
                       placeholder="Ex: Campus Central">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Atualizar Curso</button>
            <a href="{{ url_for('listar_cursos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
