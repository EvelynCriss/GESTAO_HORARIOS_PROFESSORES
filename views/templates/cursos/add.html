{% extends 'base.html' %}

{% block title %}Adicionar Curso{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Novo Curso</h1>
    <a href="{{ url_for('listar_cursos') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="form-wrapper">
    <form method="POST" action="{{ url_for('add_curso') }}">

        <div class="form-group">
            <label class="form-label" for="nome">Nome do Curso</label>
            <input type="text" class="form-control" id="nome" name="nome" required
                placeholder="Ex: Engenharia de Software">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="periodo">Período Acadêmico</label>
                <select class="form-control" id="periodo" name="periodo" required>
                    <option value="" disabled selected>Selecione o período...</option>
                    <option value="1º Período">1º Período</option>
                    <option value="2º Período">2º Período</option>
                    <option value="3º Período">3º Período</option>
                    <option value="4º Período">4º Período</option>
                    <option value="5º Período">5º Período</option>
                    <option value="6º Período">6º Período</option>
                    <option value="7º Período">7º Período</option>
                    <option value="8º Período">8º Período</option>
                    <option value="9º Período">9º Período</option>
                    <option value="10º Período">10º Período</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="campus">Campus</label>
                <input type="text" class="form-control" id="campus" name="campus" required
                    placeholder="Ex: Campus Central">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Curso</button>
            <a href="{{ url_for('listar_cursos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
