{% extends 'base.html' %}

{% block title %}Editar Aula{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Editar Aula</h1>
    <a href="{{ url_for('listar_aulas') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section">
    <form method="POST" action="{{ url_for('edit_aula', id=aula.id) }}">

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="curso_id">Curso</label>
                <select class="form-control" id="curso_id" name="curso_id" required>
                    <option value="">Selecione o curso</option>
                    {% for c in cursos %}
                    <option value="{{ c.id }}" {% if c.id == aula.curso_id %}selected{% endif %}>
                        {{ c.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="disciplina_id">Disciplina</label>
                <select class="form-control" id="disciplina_id" name="disciplina_id" required>
                    <option value="">Selecione a disciplina</option>
                    {% for d in disciplinas %}
                    <option value="{{ d.id }}" {% if d.id == aula.disciplina_id %}selected{% endif %}>
                        {{ d.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="professor_id">Professor</label>
                <select class="form-control" id="professor_id" name="professor_id" required>
                    <option value="">Selecione o professor</option>
                    {% for p in professores %}
                    <option value="{{ p.id }}" {% if p.id == aula.professor_id %}selected{% endif %}>
                        {{ p.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="dia_semana">Dia da Semana</label>
                <select class="form-control" id="dia_semana" name="dia_semana" required>
                    <option value="">Selecione o dia</option>
                    {% for dia in ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'] %}
                    <option value="{{ dia }}" {% if dia == aula.dia_semana %}selected{% endif %}>
                        {{ dia }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Horário</label>
                <input type="text" class="form-control" value="19h às 22h10" disabled>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Atualizar Aula</button>
            <a href="{{ url_for('listar_aulas') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
