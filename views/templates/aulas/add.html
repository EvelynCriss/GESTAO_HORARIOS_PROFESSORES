{% extends 'base.html' %}

{% block title %}Adicionar Aula{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Nova Aula</h1>
    <a href="{{ url_for('listar_aulas') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section">
    <form method="POST" action="{{ url_for('add_aula') }}">

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="curso_id">Curso</label>
                <select class="form-control" id="curso_id" name="curso_id" required onchange="atualizarHorario()">
                    <option value="">Selecione o curso</option>
                    {% for c in cursos %}
                    <option value="{{ c.id }}" data-periodo="{{ c.periodo }}">{{ c.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="disciplina_id">Disciplina</label>
                <select class="form-control" id="disciplina_id" name="disciplina_id" required>
                    <option value="">Selecione a disciplina</option>
                    {% for d in disciplinas %}
                    <option value="{{ d.id }}">{{ d.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="professor_id">Professor</label>
                <select class="form-control" id="professor_id" name="professor_id" required>
                    <option value="">Selecione o professor</option>
                    {% for p in professores %}
                    <option value="{{ p.id }}">{{ p.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="dia_semana">Dia da Semana</label>
                <select class="form-control" id="dia_semana" name="dia_semana" required>
                    <option value="">Selecione o dia</option>
                    <option value="Segunda">Segunda</option>
                    <option value="Terça">Terça</option>
                    <option value="Quarta">Quarta</option>
                    <option value="Quinta">Quinta</option>
                    <option value="Sexta">Sexta</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Horário</label>
                <input type="text" id="horario_input" class="form-control" value="-" disabled>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Aula</button>
            <a href="{{ url_for('listar_aulas') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script>
    function atualizarHorario() {
        let select = document.getElementById('curso_id');
        if (!select.value) {
            document.getElementById('horario_input').value = '-';
            return;
        }
        let option = select.options[select.selectedIndex];
        let periodo = option.getAttribute('data-periodo');
        let input = document.getElementById('horario_input');
        
        if (periodo === 'Matutino') {
            input.value = '08h00 às 12h10';
        } else if (periodo === 'Vespertino') {
            input.value = '13h30 às 17h40';
        } else if (periodo === 'Noturno') {
            input.value = '19h00 às 23h10';
        } else if (periodo === 'Integral') {
            input.value = 'Não especificado';
        } else {
            input.value = '-';
        }
    }
</script>
{% endblock %}
